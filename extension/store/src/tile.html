<!doctype html>
<!-- The Chrome Web Store's small promo tile, 440 × 280: the bold mark on a disc of glass and the name, heavy, on Carbon
     lit lime from below. Little text and no fine lines, so it still reads at half size (the store's guidance).
     Rendered by render.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ob.Pal Link · small promo tile</title>
    <link rel="stylesheet" href="look.css" />
    <style>
      body { width: 440px; height: 280px; }
      .light { left: -120px; top: 60px; width: 520px; height: 380px; }
      /* A sphere of glass behind the cube, which the orbit rings. Its edge is its fill, no line. */
      .disc {
        position: absolute; left: 34px; top: 48px; width: 164px; height: 164px; border-radius: 50%;
        background: radial-gradient(circle at 50% 22%, rgb(255 255 255 / 0.16), rgb(255 255 255 / 0.05) 62%, rgb(255 255 255 / 0.03));
        box-shadow: inset 0 3px 0 rgb(255 255 255 / 0.1), 0 30px 60px -26px rgb(0 0 0 / 0.95);
        backdrop-filter: blur(16px) saturate(140%);
      }
      .mark { position: absolute; left: 18px; top: 42px; width: 196px; height: 196px; filter: drop-shadow(0 10px 14px rgb(0 0 0 / 0.6)); }
      .lock { position: absolute; left: 226px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px; }
      .word { font-size: 70px; }
      .tag { height: 38px; padding: 0 16px 0 19px; font-size: 19px; }
    </style>
  </head>
  <body>
    <div class="light"></div>
    <div class="disc"></div>
    <img class="mark" src="/mark/196.svg" alt="" />
    <div class="lock">
      <div class="word"><span class="ob">ob</span><span class="pt">.</span><b>Pal</b></div>
      <span class="tag">LINK</span>
    </div>
  </body>
</html>
