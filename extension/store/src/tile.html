<!doctype html>
<!-- The Chrome Web Store's small promo tile, 440 × 280: the mark on a disc of glass and the name, on Carbon lit lime.
     Little text, so it still reads at half size (the store's guidance). Rendered by render.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ob.Pal Link · small promo tile</title>
    <link rel="stylesheet" href="look.css" />
    <style>
      body { width: 440px; height: 280px; }
      .a1 { left: -60px; top: 110px; width: 360px; height: 260px; background: rgb(var(--lime-rgb) / 0.3); --blur: 70px; }
      .a2 { right: -100px; top: -130px; width: 340px; height: 260px; background: rgb(214 230 255 / 0.09); --blur: 60px; }
      .grid { -webkit-mask-image: radial-gradient(ellipse at 30% 55%, #000 0%, transparent 60%); mask-image: radial-gradient(ellipse at 30% 55%, #000 0%, transparent 60%); }
      .orbit { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* A disc of glass the mark stands on, lit from below. */
      .disc {
        position: absolute; left: 34px; top: 46px; width: 188px; height: 188px; border-radius: 50%;
        background: radial-gradient(circle at 50% 30%, rgb(255 255 255 / 0.1), rgb(255 255 255 / 0.02) 60%), linear-gradient(180deg, rgb(30 30 32 / 0.5), rgb(14 14 15 / 0.35));
        border: 1px solid rgb(255 255 255 / 0.14);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.16), inset 0 -18px 40px -20px rgb(var(--lime-rgb) / 0.35), 0 30px 60px -28px rgb(0 0 0 / 0.9);
        backdrop-filter: blur(16px) saturate(140%);
      }
      .mark { position: absolute; left: 44px; top: 56px; width: 168px; height: 168px; filter: drop-shadow(0 12px 18px rgb(0 0 0 / 0.55)); }
      .lock { position: absolute; left: 240px; top: 94px; display: grid; justify-items: start; gap: 14px; }
      .word { font-size: 60px; }
      .tag { height: 30px; padding: 0 14px 0 16px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="aura a1"></div>
    <div class="aura a2"></div>
    <div class="grid"></div>
    <svg class="orbit" viewBox="0 0 440 280" aria-hidden="true">
      <defs><filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" /></filter></defs>
      <ellipse cx="128" cy="146" rx="300" ry="84" transform="rotate(-14 128 146)" fill="none" stroke="rgb(198 255 52 / 0.35)" stroke-width="5" filter="url(#g)" />
      <ellipse cx="128" cy="146" rx="300" ry="84" transform="rotate(-14 128 146)" fill="none" stroke="rgb(198 255 52 / 0.3)" stroke-width="1.2" />
    </svg>
    <div class="disc"></div>
    <img class="mark" src="/public/logo-mark.svg" alt="" />
    <div class="lock">
      <div class="word"><span class="ob">ob</span><span class="pt">.</span><b>Pal</b></div>
      <span class="tag">LINK</span>
    </div>
  </body>
</html>
