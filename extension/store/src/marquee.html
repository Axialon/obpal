<!doctype html>
<!-- The Chrome Web Store's marquee promo tile, 1400 × 560: the name and one heavy line on the left; on the right, a
     glass window with the bold mark and a glass phone in front of it. Brand art, not a screenshot. Everything stands
     square to the pixel grid (nothing turned by an odd angle, whose edges would step), and nothing is drawn thinner
     than 2 px. Rendered by render.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ob.Pal Link · marquee promo tile</title>
    <link rel="stylesheet" href="look.css" />
    <style>
      body { width: 1400px; height: 560px; }
      .light { left: 760px; top: 150px; width: 700px; height: 560px; }

      .copy { position: absolute; left: 88px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
      .brand img { width: 72px; height: 72px; margin: -6px -2px -6px -8px; }
      .brand .word { font-size: 46px; }
      .brand .tag { height: 34px; padding: 0 14px 0 17px; font-size: 16px; margin-left: 4px; }
      h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 76px; line-height: 1.04; letter-spacing: -0.04em; white-space: nowrap; }
      h1 em { font-style: normal; color: var(--lime); }

      /* A browser window of glass, with the mark as what's on it. */
      .window { position: absolute; left: 860px; top: 64px; width: 400px; height: 280px; border-radius: 26px; }
      .window .bar { position: absolute; left: 22px; right: 22px; top: 20px; display: flex; gap: 10px; }
      .window .bar i { height: 12px; border-radius: 99px; background: rgb(255 255 255 / 0.12); }
      .window .bar i:first-child { width: 12px; background: var(--lime); }
      .window .bar i:nth-child(2) { width: 130px; }
      .window .bar i:last-child { width: 48px; margin-left: auto; }
      .window img { position: absolute; left: 100px; top: 52px; width: 200px; height: 200px; filter: drop-shadow(0 16px 24px rgb(0 0 0 / 0.6)); }

      /* A phone of glass, upright: a lit pad, a stick and four face buttons, all solid shapes. */
      .phone { position: absolute; left: 1166px; top: 184px; width: 184px; height: 356px; border-radius: 40px; }
      .phone::before { content: ''; position: absolute; left: 66px; top: 14px; width: 52px; height: 8px; border-radius: 9px; background: rgb(255 255 255 / 0.14); }
      .phone .pad { position: absolute; left: 18px; right: 18px; top: 38px; height: 164px; border-radius: 26px; background: radial-gradient(circle at 50% 44%, rgb(var(--lime-rgb) / 0.3), rgb(var(--lime-rgb) / 0.06) 72%); box-shadow: inset 0 0 0 2px rgb(var(--lime-rgb) / 0.34); }
      .phone .pad::after { content: ''; position: absolute; left: 62px; top: 58px; width: 24px; height: 24px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 7px rgb(var(--lime-rgb) / 0.2); }
      .phone .stick { position: absolute; left: 20px; top: 232px; width: 72px; height: 72px; border-radius: 50%; background: rgb(255 255 255 / 0.07); box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.2); }
      .phone .stick::after { content: ''; position: absolute; left: 20px; top: 20px; width: 32px; height: 32px; border-radius: 50%; background: rgb(255 255 255 / 0.22); }
      .phone .face { position: absolute; left: 98px; top: 228px; width: 72px; height: 80px; }
      .phone .face i { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: rgb(255 255 255 / 0.2); }
      .phone .face i:nth-child(1) { left: 24px; top: 0; }
      .phone .face i:nth-child(2) { left: 0; top: 28px; }
      .phone .face i:nth-child(3) { left: 48px; top: 28px; }
      .phone .face i:nth-child(4) { left: 24px; top: 56px; background: var(--lime); }
    </style>
  </head>
  <body>
    <div class="light"></div>
    <div class="window glass"><div class="bar"><i></i><i></i><i></i></div><img src="/mark/200.svg" alt="" /></div>
    <div class="phone glass"><div class="pad"></div><div class="stick"></div><div class="face"><i></i><i></i><i></i><i></i></div></div>
    <div class="copy">
      <div class="brand"><img src="/mark/72.svg" alt="" /><span class="word"><span class="ob">ob</span><span class="pt">.</span><b>Pal</b></span><span class="tag">LINK</span></div>
      <h1>Your phone controls<br /><em>websites</em></h1>
    </div>
  </body>
</html>
