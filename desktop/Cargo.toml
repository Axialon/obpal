[package]
name = "obpal-desktop"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "ob.Pal Desktop: the native helper that turns phone input into keyboard and mouse input for allowed programs, reached only through the ob.Pal Link browser extension (Chrome Native Messaging)."
default-run = "obpal-desktop"

[lib]
name = "obpal_desktop"
path = "src/lib.rs"

[[bin]]
name = "obpal-desktop"
path = "src/main.rs"

[[bin]]
name = "obpal-harness"
path = "src/bin/harness.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
