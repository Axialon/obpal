<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="A device from ob.Pal's sim catalogue, driven by your phone: scan the code, and a unit is yours. Rovers, drones, cameras, lamps and more, each with the controllers that suit it." />
    <title>Device · ob.Pal</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/family/family.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/sim.css" />
    <link rel="stylesheet" href="/src/styles/devices.css" />
    <script type="module" src="/src/sim/devices/main.ts"></script>
  </head>
  <body class="sim dev">
    <canvas id="stage" aria-label="Device"></canvas>
    <div class="dev-cursors" id="cursors" aria-hidden="true"></div>
    <header class="sim-top">
      <div class="sim-left">
        <a class="logo" href="/" aria-label="ob.Pal"><span class="mark-slot" data-mark></span><span class="word"><span class="ob">ob</span><span class="pt">.</span><b>Pal</b></span></a>
        <button class="switch-btn" id="t-switch" type="button" aria-label="Blackboxes apps" title="Blackboxes apps"></button>
        <a class="sim-crumb" href="/sim/">Sims</a>
      </div>
      <div class="chip glass" id="chip" hidden>
        <button class="chip-who" id="chip-who" aria-label="People in this scene">
          <span class="chip-people" id="chip-people"></span>
          <span class="chip-text" id="chip-text"></span>
        </button>
        <button class="chip-x" id="chip-invite" aria-label="Invite another device" aria-pressed="false" data-icon="plus"></button>
        <button class="chip-x" id="chip-disc" aria-label="Disconnect everyone" data-icon="close"></button>
      </div>
      <div class="sim-right">
        <button class="dev-tool glass" id="t-theme" type="button" aria-label="Surface and accent" title="Surface and accent" data-icon="palette"></button>
      </div>
    </header>

    <aside class="sim-panel glass dev-panel" aria-labelledby="dev-name">
      <p class="eyebrow" id="dev-kind">Device</p>
      <h1 id="dev-name">Device</h1>
      <p class="sim-lede" id="dev-blurb"></p>
      <div class="dev-faces" id="dev-faces" role="group" aria-label="Controllers that suit it"></div>
      <p class="dev-how" id="dev-how" aria-live="polite"></p>
      <ul class="dev-units" id="dev-units" aria-label="Units"></ul>
      <div class="safety">
        <button class="btn" id="home-all" data-icon="reset">Home all</button>
        <button class="btn" id="reset" hidden>Reset</button>
      </div>
      <details class="log-wrap"><summary>Record</summary><ol class="log" id="log"></ol></details>
    </aside>

    <div class="people glass" id="people" hidden role="dialog" aria-label="People in this scene">
      <ul class="people-list" id="people-list"></ul>
      <button class="people-new" id="invite-new">New invite link</button>
    </div>
    <p class="note" id="note" role="status"></p>
    <div class="bb-menu bb-glass switcher" id="switcher" aria-label="Blackboxes apps" hidden></div>
    <div class="bb-menu bb-glass themes-menu" id="themes" aria-label="Surface and accent" hidden></div>
  </body>
</html>
