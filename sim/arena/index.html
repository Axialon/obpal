<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Up to four players on one screen, each with their own phone: scan, pick a slot, tilt to roll and knock the others off the ring." />
    <title>Faction arena · ob.Pal</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/family/family.css" />
    <script type="module" src="/src/sim/arena.ts"></script>
  </head>
  <body class="sim">
    <canvas id="stage" aria-label="Faction arena"></canvas>
    <header class="sim-top">
      <div class="sim-left">
        <a class="logo" href="/" aria-label="ob.Pal"><span class="mark-slot" data-mark></span><span class="word"><span class="ob">ob</span><span class="pt">.</span><b>Pal</b></span></a>
        <button class="switch-btn" id="t-switch" type="button" aria-label="Blackboxes apps" title="Blackboxes apps"></button>
        <a class="sim-crumb" href="/sim/">Sims</a>
      </div>
      <div class="chip glass" id="chip" hidden>
        <button class="chip-who" id="chip-who" aria-label="People in this scene">
          <span class="chip-people" id="chip-people"></span>
          <span class="chip-text" id="chip-text"></span>
        </button>
        <button class="chip-x" id="chip-invite" aria-label="Invite another device" aria-pressed="false" data-icon="plus"></button>
        <button class="chip-x" id="chip-disc" aria-label="Disconnect everyone" data-icon="close"></button>
      </div>
    </header>

    <aside class="sim-panel glass" aria-label="Arena">
      <p class="eyebrow">system.gamepad-slots</p>
      <h1>Faction arena</h1>
      <p class="sim-lede">Up to four players. Scan the code, pick a slot from your phone's scene list, then tilt to roll, drag to push and tap to dash. Knock the others off the ring.</p>
      <ul class="score" id="score"></ul>
      <div class="safety"><button class="btn" id="reset-scores">Reset scores</button></div>
      <details class="log-wrap"><summary>Record</summary><ol class="log" id="log"></ol></details>
    </aside>

    <div class="people glass" id="people" hidden role="dialog" aria-label="People in this scene">
      <ul class="people-list" id="people-list"></ul>
      <button class="people-new" id="invite-new">New invite link</button>
    </div>
    <p class="note" id="note" role="status"></p>
    <div class="bb-menu bb-glass switcher" id="switcher" aria-label="Blackboxes apps" hidden></div>
  </body>
</html>
